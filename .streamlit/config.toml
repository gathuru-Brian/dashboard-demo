[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.dark]
primaryColor = "#38BDF8"
backgroundColor = "#04080F"
secondaryBackgroundColor = "#0F172A"
textColor = "#E2E8F0"
linkColor = "#7DD3FC"
borderColor = "#334155"
chartCategoricalColors = ["#38BDF8", "#A78BFA", "#34D399", "#FBBF24", "#FB7185", "#60A5FA"]

[theme.dark.sidebar]
backgroundColor = "#02040A"
secondaryBackgroundColor = "#0F172A"
textColor = "#E2E8F0"
borderColor = "#1E293B"

[theme.light]
primaryColor = "#075985"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EAF2F8"
textColor = "#0F172A"
linkColor = "#0369A1"
borderColor = "#CBD5E1"
chartCategoricalColors = ["#0369A1", "#6D28D9", "#047857", "#B45309", "#BE123C", "#1D4ED8"]

[theme.light.sidebar]
backgroundColor = "#EEF6FB"
secondaryBackgroundColor = "#E0F2FE"
textColor = "#0F172A"
borderColor = "#CBD5E1"

[server]
headless = true

[browser]
gatherUsageStats = false
