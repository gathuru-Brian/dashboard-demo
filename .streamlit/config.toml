[theme]
base = "dark"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap"
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.dark]
primaryColor = "#38BDF8"
backgroundColor = "#020617"
secondaryBackgroundColor = "#0B1220"
textColor = "#E2E8F0"
linkColor = "#7DD3FC"
borderColor = "#1E293B"
chartCategoricalColors = ["#38BDF8", "#A78BFA", "#34D399", "#FBBF24", "#FB7185", "#60A5FA"]

[theme.dark.sidebar]
backgroundColor = "#020617"
secondaryBackgroundColor = "#0B1220"
textColor = "#E2E8F0"
borderColor = "#1E293B"

[server]
headless = true

[browser]
gatherUsageStats = false